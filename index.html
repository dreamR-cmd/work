    <script>
      // 首帧渲染前确定主题，避免暗色模式下的闪白（支持 ?theme=dark 强制预览）
      ;(function () {
        var t = null
        try {
          t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('theme')
        } catch (e) {}
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
